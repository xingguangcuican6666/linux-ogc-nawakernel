name: build_kernel

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/linux-ogc-nawakernel-builder:latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Builder
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull or build image
              run: |
                if ! docker pull "$IMAGE"; then
                  docker build -t "$IMAGE" .
                fi
            
            - name: Run kernel build
              run: |
                mkdir -p "$PWD/out"
                chmod 777 -R "$PWD/out"
                docker run --rm \
                    -e SECRET_SKEY="${{ secrets.SECRET_SKEY }}" \
                    -v "$PWD/out:/work/out" \
                    -v "$PWD/scripts:/work/scripts:ro" \
                    -v "$PWD/patchs:/work/patchs:ro" \
                    "$IMAGE"
            
            - name: Upload kernel packages
              uses: actions/upload-artifact@v4
              with: 
                name: kernel
                path: ./out/*.pkg.tar.zst
                if-no-files-found: error

            - name: Upload rejected patches
              uses: actions/upload-artifact@v4
              with:
                name: rejected-patches
                path: ./out/rej.tar.gz
                if-no-files-found: error


